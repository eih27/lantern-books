<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lantern Books — Your Cart</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Lantern <span>Books</span></a>
      <nav class="nav">
        <a href="index.html" class="hide-sm">Home</a>
        <a href="index.html#shop" class="hide-sm">Shop</a>
        <a href="cart.html" class="cart-link">Cart<span id="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <!-- 4. Cart page showing selected products and total amount -->
  <main class="section">
    <div class="container">
      <h2>Your Cart</h2>
      <div id="cart-root"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 Lantern Books · A class project built with Claude Code</div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    const root = document.getElementById("cart-root");

    function render() {
      const items = cartItems();
      if (items.length === 0) {
        root.innerHTML = `
          <div class="empty">
            <p>Your cart is empty.</p>
            <a href="index.html#shop" class="btn btn-primary">Start shopping</a>
          </div>`;
        return;
      }
      root.innerHTML = `
        <div class="cart-layout">
          <div class="cart-list">
            ${items.map(({ product, qty, lineTotal }) => `
              <div class="cart-row">
                ${coverSvg(product)}
                <div>
                  <h3>${product.name}</h3>
                  <div class="author">${money(product.price)} each</div>
                  <button class="remove" data-action="remove" data-id="${product.id}">Remove</button>
                </div>
                <div class="qty">
                  <button data-action="dec" data-id="${product.id}" aria-label="Decrease quantity">−</button>
                  <span>${qty}</span>
                  <button data-action="inc" data-id="${product.id}" aria-label="Increase quantity">+</button>
                </div>
                <div class="line-total">${money(lineTotal)}</div>
              </div>`).join("")}
          </div>
          <aside class="summary">
            <h3>Order Summary</h3>
            <div class="summary-row"><span>Items</span><span>${cartCount()}</span></div>
            <div class="summary-row"><span>Shipping</span><span>Free</span></div>
            <div class="summary-row total"><span>Total</span><span>${money(cartTotal())}</span></div>
            <a href="checkout.html" class="btn btn-primary btn-block">Proceed to Checkout</a>
            <a href="index.html#shop" class="btn btn-ghost btn-block" style="margin-top:8px">Continue Shopping</a>
          </aside>
        </div>`;
    }

    // Handle the +, − and Remove buttons.
    root.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      const id = btn.dataset.id;
      const qty = getCart()[id] || 0;
      if (btn.dataset.action === "inc") setQuantity(id, qty + 1);
      if (btn.dataset.action === "dec") setQuantity(id, qty - 1);
      if (btn.dataset.action === "remove") setQuantity(id, 0);
      render();
    });

    render();
  </script>
</body>
</html>
